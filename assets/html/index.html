<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1416" />
  <title>GreenScape — Landscaping Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    /* Force the classic JSX runtime (React.createElement) so the compiled
       script runs directly in the browser without ES module imports. */
    Babel.registerPreset('classicjsx', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
    });
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950:'#0f1416', 900:'#14191c', 800:'#1a2024', 700:'#1e2428', 600:'#283036', 500:'#2c343a', 400:'#3a444b', 300:'#4a555e' },
            mint: { DEFAULT:'#00e676', dark:'#00c853', soft:'#1de9b6', glow:'rgba(0,230,118,0.25)' },
          },
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
          borderRadius: { '4xl': '2rem' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }
    body { background:#0b0f11; font-family:'Inter',ui-sans-serif,system-ui,sans-serif; overscroll-behavior:none; }
    ::-webkit-scrollbar { width:0; height:0; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    .anim-fade { animation: fadeIn .4s ease both; }
    @keyframes scaleIn { from{opacity:0; transform:scale(.95)} to{opacity:1; transform:scale(1)} }
    .anim-scale { animation: scaleIn .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes slideUp { from{opacity:0; transform:translateY(40px)} to{opacity:1; transform:translateY(0)} }
    .anim-slide { animation: slideUp .32s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes slideInRight { from{opacity:0; transform:translateX(40px)} to{opacity:1; transform:translateX(0)} }
    .anim-right { animation: slideInRight .3s ease both; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .anim-float { animation: float 4s ease-in-out infinite; }
    @keyframes grow { from{width:0} }
    .bar-grow { animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes spinSlow { to { transform: rotate(360deg) } }
    .spin-slow { animation: spinSlow 1s linear infinite; }
    .glass { background: rgba(40,48,54,0.7); backdrop-filter: blur(12px); }
    .tap { transition: transform .12s ease; }
    .tap:active { transform: scale(0.96); }
    [data-theme="light"] body { background:#e9eef2 !important; }
    [data-theme="light"] .bg-ink-900 { background-color:#ffffff !important; }
    [data-theme="light"] .bg-ink-800 { background-color:#e9eef2 !important; }
    [data-theme="light"] .bg-ink-700 { background-color:#e2e8ec !important; }
    [data-theme="light"] .bg-ink-600 { background-color:#ffffff !important; }
    [data-theme="light"] .bg-ink-400 { background-color:#cbd5dc !important; }
    [data-theme="light"] .text-white { color:#0f1416 !important; }
    [data-theme="light"] .text-ink-300 { color:#3a444b !important; }
    [data-theme="light"] .text-ink-400 { color:#6b7780 !important; }
    [data-theme="light"] .glass { background: rgba(255,255,255,0.82) !important; }
    [data-theme="light"] .border-white\/5 { border-color: rgba(0,0,0,0.08) !important; }
    [data-theme="light"] .border-white\/10 { border-color: rgba(0,0,0,0.1) !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="classicjsx">
  const { useState, useEffect, useRef, useMemo } = React;

  /* ---------------- Icons (inline SVG, Lucide-style) ---------------- */
  const I = {
    home: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>),
    search: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>),
    calendar: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>),
    bag: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4z"/><path d="M4 6h16M16 10a4 4 0 0 1-8 0"/></svg>),
    user: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>),
    bell: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>),
    back: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m15 18-6-6 6-6"/></svg>),
    star: (p)=>(<svg viewBox="0 0 24 24" fill="currentColor" {...p}><path d="m12 2 3 6.5 7 .9-5 4.8 1.3 7-6.3-3.4L6.4 21l1.3-7-5-4.8 7-.9z"/></svg>),
    clock: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>),
    pin: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>),
    plus: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 5v14M5 12h14"/></svg>),
    minus: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14"/></svg>),
    check: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m20 6-11 11-5-5"/></svg>),
    leaf: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 16-9 0 10-4 14-9 14z"/><path d="M4 21c2-5 5-8 9-9"/></svg>),
    tree: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 2 7 8h3l-4 5h4v9h4v-9h4l-4-5h3z"/></svg>),
    scissors: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8 8 20 18M8 16 20 6"/></svg>),
    drop: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/></svg>),
    sun: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>),
    sprout: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M7 20h10M12 20v-8"/><path d="M12 12c0-3 2-5 6-5 0 4-2 6-6 6zM12 12c0-3-2-5-6-5 0 4 2 6 6 6z"/></svg>),
    trash: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>),
    settings: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4.9a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2a7 7 0 0 0-1.7 1l-2.4-.9-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-.9a7 7 0 0 0 1.7 1l.3 2h5l.3-2a7 7 0 0 0 1.7-1l2.4.9 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg>),
    heart: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>),
    chevron: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m9 6 6 6-6 6"/></svg>),
    phone: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 3h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>),
    logout: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>),
    card: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>),
    award: (p)=>(<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="9" r="6"/><path d="M9 14 7 22l5-3 5 3-2-8"/></svg>),
  };

  const iconFor = (key) => ({grass:I.leaf, tree:I.tree, scissors:I.scissors, drop:I.drop, sun:I.sun, sprout:I.sprout}[key] || I.leaf);

  /* ---------------- Data ---------------- */
  const SERVICES = [
    { id:1, name:'Lawn Mowing', price:35, icon:'grass', rating:4.9, reviews:328, duration:'45 min', desc:'Professional mowing & edging for a crisp, healthy lawn.', tag:'Popular', img:'https://images.unsplash.com/photo-1599598148555-941c7c1b9a3b?w=700&q=80' },
    { id:2, name:'Garden Design', price:120, icon:'sprout', rating:4.8, reviews:142, duration:'3 hrs', desc:'Custom garden layout with plants, beds & pathways.', tag:'Premium', img:'https://images.unsplash.com/photo-1416879595882-3373a0480205?w=700&q=80' },
    { id:3, name:'Tree Trimming', price:80, icon:'tree', rating:4.7, reviews:96, duration:'2 hrs', desc:'Safe trimming & pruning to keep trees healthy & shaped.', tag:'', img:'https://images.unsplash.com/photo-1591850179078-2a4d1a2f4b1c?w=700&q=80' },
    { id:4, name:'Hedge Trimming', price:45, icon:'scissors', rating:4.8, reviews:210, duration:'1 hr', desc:'Neat, sculpted hedges that frame your property.', tag:'', img:'https://images.unsplash.com/photo-1558904541-efa843a96f02?w=700&q=80' },
    { id:5, name:'Irrigation Setup', price:95, icon:'drop', rating:4.9, reviews:74, duration:'2.5 hrs', desc:'Smart sprinkler installation for a lush, water-wise yard.', tag:'New', img:'https://images.unsplash.com/photo-1530836369250-972e0a5da8c2?w=700&q=80' },
    { id:6, name:'Landscape Lighting', price:110, icon:'sun', rating:4.7, reviews:58, duration:'2 hrs', desc:'Warm outdoor lighting that elevates your evenings.', tag:'', img:'https://images.unsplash.com/photo-1503614473-21ada49f22a2?w=700&q=80' },
  ];

  const CATEGORIES = [
    { key:'grass', label:'Lawn Care' },
    { key:'sprout', label:'Gardens' },
    { key:'tree', label:'Trees' },
    { key:'drop', label:'Irrigation' },
    { key:'sun', label:'Lighting' },
    { key:'scissors', label:'Hedges' },
  ];

  const TIME_SLOTS = ['08:00 AM','09:30 AM','11:00 AM','01:00 PM','02:30 PM','04:00 PM','05:30 PM'];

  /* ---------------- Splash ---------------- */
  function Splash({ onDone }){
    useEffect(()=>{ const id = setTimeout(onDone, 2200); return ()=>clearTimeout(id); },[]);
    return (
      <div className="absolute inset-0 bg-ink-900 flex flex-col items-center justify-center anim-scale">
        <div className="relative anim-float">
          <div className="w-28 h-28 rounded-[2rem] bg-gradient-to-br from-mint to-mint-soft flex items-center justify-center shadow-[0_0_60px_-5px] shadow-mint-glow">
            <I.leaf className="w-14 h-14 text-ink-900" />
          </div>
        </div>
        <h1 className="mt-7 text-white text-3xl font-extrabold tracking-tight">GreenScape</h1>
        <p className="mt-2 text-ink-300 text-sm font-medium">Your yard, perfectly kept.</p>
        <div className="absolute bottom-16 flex items-center gap-2">
          <div className="w-2 h-2 rounded-full bg-mint animate-pulse"></div>
          <span className="text-ink-400 text-xs font-medium tracking-widest uppercase">Loading</span>
        </div>
      </div>
    );
  }

  /* ---------------- Onboarding ---------------- */
  function Onboarding({ onDone }){
    const [step,setStep] = useState(0);
    const slides = [
      { t:'Care for your lawn', d:'Book expert lawn care in seconds — mowing, edging & treatment, done right.', icon:I.leaf, img:'https://images.unsplash.com/photo-1558904541-efa843a96f02?w=700&q=80' },
      { t:'Design dream gardens', d:'Work with pros to plan, plant & maintain a garden you will love.', icon:I.sprout, img:'https://images.unsplash.com/photo-1416879595882-3373a0480205?w=700&q=80' },
      { t:'Book in a tap', d:'Pick a service, choose a time, and relax. We handle the rest.', icon:I.calendar, img:'https://images.unsplash.com/photo-1530836369250-972e0a5da8c2?w=700&q=80' },
    ];
    const s = slides[step];
    const next = ()=> step < slides.length-1 ? setStep(step+1) : onDone();
    return (
      <div className="absolute inset-0 bg-ink-900 flex flex-col anim-fade">
        <div className="relative h-[52%] overflow-hidden">
          <div className="absolute inset-0 bg-cover bg-center" style={{backgroundImage:`linear-gradient(180deg,rgba(20,25,28,0) 85%,#14191c 100%),url(${s.img})`}}></div>
          <button onClick={onDone} className="absolute top-12 right-5 text-white/90 text-sm font-semibold">Skip</button>
        </div>
        <div className="flex-1 flex flex-col items-center text-center px-8 -mt-6">
          <div className="w-14 h-14 rounded-2xl bg-mint/15 text-mint flex items-center justify-center mb-5"><s.icon className="w-7 h-7"/></div>
          <h2 className="text-white text-2xl font-extrabold">{s.t}</h2>
          <p className="mt-3 text-ink-300 text-sm leading-relaxed max-w-[280px]">{s.d}</p>
          <div className="flex gap-2 mt-7">
            {slides.map((_,i)=> <div key={i} className={`h-1.5 rounded-full transition-all ${i===step?'w-7 bg-mint':'w-1.5 bg-ink-400'}`}/>)}
          </div>
        </div>
        <div className="px-6 pb-10">
          <button onClick={next} className="w-full h-14 rounded-2xl bg-mint text-ink-900 font-bold text-base tap active:scale-95">
            {step < slides.length-1 ? 'Next' : 'Get Started'}
          </button>
        </div>
      </div>
    );
  }

  /* ---------------- Bottom Nav ---------------- */
  function BottomNav({ active, go, cartCount }){
    const items = [
      { key:'home', label:'Home', icon:I.home },
      { key:'services', label:'Services', icon:I.search },
      { key:'booking', label:'Book', icon:I.calendar },
      { key:'cart', label:'Cart', icon:I.bag, badge:cartCount },
      { key:'profile', label:'Settings', icon:I.settings },
    ];
    return (
      <div className="absolute bottom-0 left-0 right-0 z-30">
        <div className="glass border-t border-white/5 px-3 pt-2 pb-5 flex justify-around">
          {items.map(it=>{
            const on = active===it.key;
            return (
              <button key={it.key} onClick={()=>go(it.key)} className="relative flex flex-col items-center gap-1 tap">
                <div className={`relative w-11 h-8 rounded-xl flex items-center justify-center transition-colors ${on?'bg-mint/15 text-mint':'text-ink-300'}`}>
                  <it.icon className="w-[22px] h-[22px]"/>
                  {!!it.badge && it.badge>0 && <span className="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-mint text-ink-900 text-[10px] font-bold flex items-center justify-center">{it.badge}</span>}
                </div>
                <span className={`text-[10px] font-semibold ${on?'text-mint':'text-ink-400'}`}>{it.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  /* ---------------- Shared bits ---------------- */
  function Section({ title, action, onAction, children }){
    return (
      <div className="mt-6">
        <div className="flex items-center justify-between px-5 mb-3">
          <h3 className="text-white font-bold text-base">{title}</h3>
          {action && <button onClick={onAction} className="text-mint text-xs font-semibold">{action}</button>}
        </div>
        {children}
      </div>
    );
  }

  /* ---------------- Home ---------------- */
  function Home({ go, openService, cart }){
    const stats = [
      { label:'Jobs done', value:'24', icon:I.check },
      { label:'Next visit', value:'Sep 12', icon:I.calendar },
    ];
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-fade">
        <div className="flex items-center justify-between px-5 pt-3">
          <div>
            <p className="text-ink-400 text-xs font-medium">Welcome to</p>
            <h1 className="text-white text-xl font-extrabold">GreenScape</h1>
          </div>
          <button onClick={()=>go('notifications')} className="relative w-11 h-11 rounded-2xl bg-ink-600 flex items-center justify-center tap">
            <I.bell className="w-5 h-5 text-white"/>
            <span className="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-mint"></span>
          </button>
        </div>

        {/* search */}
        <div className="px-5 mt-4">
          <div className="flex items-center gap-3 h-14 px-4 py-3.5 rounded-2xl bg-ink-600">
            <I.search className="w-5 h-5 text-ink-300"/>
            <input placeholder="Search services…" className="bg-transparent text-white text-sm placeholder:text-ink-400 outline-none flex-1"/>
          </div>
        </div>

        {/* hero banner */}
        <div className="px-5 mt-5">
          <div className="relative overflow-hidden rounded-3xl p-5 bg-gradient-to-br from-mint to-mint-soft h-36">
            <div className="relative z-10 max-w-[60%]">
              <p className="text-ink-900/70 text-xs font-bold uppercase tracking-wide">Autumn offer</p>
              <h3 className="text-ink-900 text-lg font-extrabold leading-tight mt-1">20% off seasonal clean-up</h3>
              <button onClick={()=>go('services')} className="mt-3 px-4 py-1.5 rounded-full bg-ink-900 text-white text-xs font-bold tap">Book now</button>
            </div>
            <I.leaf className="absolute -right-4 -bottom-4 w-32 h-32 text-ink-900/15"/>
          </div>
        </div>

        {/* stats */}
        <div className="px-5 mt-5 grid grid-cols-2 gap-3">
          {stats.map(s=>(
            <div key={s.label} className="rounded-2xl bg-ink-600 p-4">
              <div className="w-9 h-9 rounded-xl bg-mint/15 text-mint flex items-center justify-center mb-2"><s.icon className="w-5 h-5"/></div>
              <p className="text-white text-lg font-extrabold leading-none">{s.value}</p>
              <p className="text-ink-400 text-xs mt-1">{s.label}</p>
            </div>
          ))}
        </div>

        {/* categories */}
        <Section title="Categories">
          <div className="flex gap-3 overflow-x-auto no-scrollbar px-5 pb-1">
            {CATEGORIES.map(c=>(
              <button key={c.key} onClick={()=>go('services')} className="flex-shrink-0 w-20 flex flex-col items-center gap-2 tap">
                <div className="w-16 h-16 rounded-2xl bg-ink-600 flex items-center justify-center text-mint">{(()=>{const Ic=iconFor(c.key);return <Ic className="w-7 h-7"/>})()}</div>
                <span className="text-ink-300 text-[11px] font-medium text-center">{c.label}</span>
              </button>
            ))}
          </div>
        </Section>

        {/* featured */}
        <Section title="Featured services" action="See all" onAction={()=>go('services')}>
          <div className="flex gap-3 overflow-x-auto no-scrollbar px-5 pb-1">
            {SERVICES.slice(0,4).map(s=>(
              <button key={s.id} onClick={()=>openService(s)} className="flex-shrink-0 w-56 text-left tap">
                <div className="relative h-32 rounded-2xl overflow-hidden bg-cover bg-center" style={{backgroundImage:`linear-gradient(180deg,rgba(20,25,28,0) 40%,#14191c 100%),url(${s.img})`}}>
                  {s.tag && <span className="absolute top-2.5 left-2.5 px-2 py-0.5 rounded-full bg-mint text-ink-900 text-[10px] font-bold">{s.tag}</span>}
                </div>
                <div className="px-1 pt-2.5">
                  <div className="flex items-center justify-between">
                    <p className="text-white text-sm font-bold">{s.name}</p>
                    <span className="text-mint text-sm font-extrabold">${s.price}</span>
                  </div>
                  <div className="flex items-center gap-1 mt-1">
                    <I.star className="w-3 h-3 text-mint"/>
                    <span className="text-ink-300 text-[11px] font-medium">{s.rating} · {s.duration}</span>
                  </div>
                </div>
              </button>
            ))}
          </div>
        </Section>

        {/* upcoming */}
        <Section title="Upcoming booking">
          <div className="mx-5 rounded-2xl bg-ink-600 p-4 flex items-center gap-3">
            <div className="w-12 h-12 rounded-xl bg-mint/15 text-mint flex items-center justify-center"><I.leaf className="w-6 h-6"/></div>
            <div className="flex-1">
              <p className="text-white font-bold text-sm">Lawn Mowing</p>
              <p className="text-ink-400 text-xs mt-0.5">Sep 12 · 09:30 AM</p>
            </div>
            <I.chevron className="w-5 h-5 text-ink-400"/>
          </div>
        </Section>
      </div>
    );
  }

  /* ---------------- Services ---------------- */
  function Services({ openService, go }){
    const [q,setQ] = useState('');
    const [cat,setCat] = useState('all');
    const filtered = SERVICES.filter(s=> (cat==='all'|| CATEGORIES.find(c=>c.key===s.icon)) && s.name.toLowerCase().includes(q.toLowerCase()));
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-fade">
        <div className="px-5 pt-4">
          <h1 className="text-white text-2xl font-extrabold">Services</h1>
          <div className="flex items-center gap-3 h-14 px-4 py-3.5 rounded-2xl bg-ink-600 mt-4">
            <I.search className="w-5 h-5 text-ink-300"/>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search…" className="bg-transparent text-white text-sm placeholder:text-ink-400 outline-none flex-1"/>
          </div>
          <div className="flex gap-2 overflow-x-auto no-scrollbar mt-4 -mx-1 px-1">
            {[{key:'all',label:'All'},...CATEGORIES].map(c=>(
              <button key={c.key} onClick={()=>setCat(c.key)} className={`flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold tap ${cat===c.key?'bg-mint text-ink-900':'bg-ink-600 text-ink-300'}`}>{c.label}</button>
            ))}
          </div>
        </div>
        <div className="px-5 mt-4 space-y-3">
          {filtered.map(s=>{
            const Ic = iconFor(s.icon);
            return (
              <button key={s.id} onClick={()=>openService(s)} className="w-full flex gap-3 p-3 rounded-2xl bg-ink-600 text-left tap">
                <div className="w-20 h-20 rounded-xl bg-cover bg-center flex-shrink-0" style={{backgroundImage:`linear-gradient(180deg,rgba(20,25,28,0) 50%,#14191c 100%),url(${s.img})`}}></div>
                <div className="flex-1 min-w-0 py-0.5">
                  <div className="flex items-center gap-2">
                    <p className="text-white font-bold text-sm truncate">{s.name}</p>
                    {s.tag && <span className="px-1.5 py-0.5 rounded bg-mint/15 text-mint text-[9px] font-bold">{s.tag}</span>}
                  </div>
                  <p className="text-ink-400 text-xs mt-1 line-clamp-2">{s.desc}</p>
                  <div className="flex items-center justify-between mt-2">
                    <div className="flex items-center gap-1">
                      <I.star className="w-3 h-3 text-mint"/>
                      <span className="text-ink-300 text-[11px] font-semibold">{s.rating}</span>
                      <span className="text-ink-400 text-[11px]">· {s.duration}</span>
                    </div>
                    <span className="text-mint font-extrabold text-sm">${s.price}</span>
                  </div>
                </div>
              </button>
            );
          })}
          {filtered.length===0 && <p className="text-center text-ink-400 text-sm py-10">No services found.</p>}
        </div>
      </div>
    );
  }

  /* ---------------- Service Detail ---------------- */
  function ServiceDetail({ service, onBack, addToCart, go }){
    const [qty,setQty] = useState(1);
    const [step,setStep] = useState('buy');
    const [form,setForm] = useState({name:'',email:'',phone:''});
    const submit = (e)=>{ e.preventDefault(); addToCart({...service, qty}); setStep('done'); };
    if(step==='done'){
      return (
        <div className="h-full flex flex-col items-center justify-center px-8 anim-fade text-center">
          <div className="w-20 h-20 rounded-3xl bg-mint/15 text-mint flex items-center justify-center mb-5"><I.check className="w-10 h-10"/></div>
          <h2 className="text-white text-xl font-extrabold">Added to cart!</h2>
          <p className="text-ink-300 text-sm mt-2">Thanks {form.name}. We will call you shortly on {form.phone} to confirm your service.</p>
          <div className="flex gap-3 mt-6">
            <button onClick={onBack} className="px-6 h-12 rounded-2xl bg-ink-600 text-white font-bold tap">Continue</button>
            <button onClick={()=>go('cart')} className="px-6 h-12 rounded-2xl bg-mint text-ink-900 font-bold tap">View cart</button>
          </div>
        </div>
      );
    }
    const inputCls = "w-full h-14 px-4 rounded-2xl bg-ink-600 text-white text-sm placeholder:text-ink-400 outline-none";
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-right">
        <div className="relative h-60 bg-cover bg-center" style={{backgroundImage:`linear-gradient(180deg,rgba(20,25,28,0) 40%,#14191c 100%),url(${service.img})`}}>
          <button onClick={onBack} className="absolute top-12 left-5 w-10 h-10 rounded-full glass flex items-center justify-center tap"><I.back className="w-5 h-5 text-white"/></button>
          <button className="absolute top-12 right-5 w-10 h-10 rounded-full glass flex items-center justify-center tap"><I.heart className="w-5 h-5 text-white"/></button>
        </div>
        <div className="px-5 -mt-4">
          <div className="flex items-center gap-2">
            {service.tag && <span className="px-2 py-0.5 rounded-full bg-mint text-ink-900 text-[10px] font-bold">{service.tag}</span>}
            <div className="flex items-center gap-1"><I.star className="w-3.5 h-3.5 text-mint"/><span className="text-white text-xs font-semibold">{service.rating}</span><span className="text-ink-400 text-xs">({service.reviews})</span></div>
          </div>
          <h1 className="text-white text-2xl font-extrabold mt-2">{service.name}</h1>
          <div className="flex items-center gap-4 mt-2 text-ink-300 text-xs">
            <span className="flex items-center gap-1"><I.clock className="w-4 h-4 text-mint"/> {service.duration}</span>
            <span className="flex items-center gap-1"><I.award className="w-4 h-4 text-mint"/> Verified pro</span>
          </div>
          <p className="text-ink-300 text-sm leading-relaxed mt-4">{service.desc} Our insured team brings professional-grade equipment and leaves your space spotless.</p>
          <div className="mt-5 flex items-center justify-between p-3 rounded-2xl bg-ink-600">
            <span className="text-ink-300 text-sm font-medium">Quantity</span>
            <div className="flex items-center gap-4">
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} className="w-9 h-9 rounded-xl bg-ink-700 text-white flex items-center justify-center tap"><I.minus className="w-4 h-4"/></button>
              <span className="text-white font-bold w-5 text-center">{qty}</span>
              <button onClick={()=>setQty(q=>q+1)} className="w-9 h-9 rounded-xl bg-mint text-ink-900 flex items-center justify-center tap"><I.plus className="w-4 h-4"/></button>
            </div>
          </div>
        </div>
        {step==='form' && (
          <div className="absolute inset-0 z-40 flex items-end anim-slide">
            <div className="w-full bg-ink-800 rounded-t-3xl p-5 pb-8">
              <div className="w-10 h-1 rounded-full bg-ink-400 mx-auto mb-4"></div>
              <h3 className="text-white font-extrabold text-lg">Enter your details</h3>
              <p className="text-ink-400 text-xs mt-0.5">We'll call you to confirm your booking.</p>
              <form onSubmit={submit} className="mt-4 space-y-3">
                <input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Full name" className={inputCls}/>
                <input required type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="Email address" className={inputCls}/>
                <input required type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Phone number" className={inputCls}/>
                <button type="submit" className="w-full h-14 rounded-2xl bg-mint text-ink-900 font-bold tap flex items-center justify-center gap-2"><I.check className="w-5 h-5"/> Confirm & add to cart</button>
                <button type="button" onClick={()=>setStep('buy')} className="w-full h-12 rounded-2xl bg-ink-600 text-white font-bold tap">Cancel</button>
              </form>
            </div>
          </div>
        )}
        <div className="absolute bottom-0 left-0 right-0 glass border-t border-white/5 px-5 py-4 pb-6 flex items-center gap-3">
          <div>
            <p className="text-ink-400 text-[11px]">Total</p>
            <p className="text-white text-xl font-extrabold">${service.price*qty}</p>
          </div>
          <button onClick={()=>setStep('form')} className="flex-1 h-14 rounded-2xl bg-mint text-ink-900 font-bold tap flex items-center justify-center gap-2"><I.bag className="w-5 h-5"/> Add to cart</button>
        </div>
      </div>
    );
  }

  /* ---------------- Booking ---------------- */
  function Booking({ go, cart }){
    const [form,setForm] = useState({name:'',phone:'',email:'',date:'',time:''});
    const [done,setDone] = useState(false);
    const submit = (e)=>{ e.preventDefault(); setDone(true); };
    if(done){
      return (
        <div className="h-full flex flex-col items-center justify-center px-8 anim-fade text-center">
          <div className="w-20 h-20 rounded-3xl bg-mint/15 text-mint flex items-center justify-center mb-5"><I.check className="w-10 h-10"/></div>
          <h2 className="text-white text-xl font-extrabold">Request received!</h2>
          <p className="text-ink-300 text-sm mt-2">Thanks {form.name}. We will call you shortly on {form.phone} to confirm your booking.</p>
          <button onClick={()=>go('home')} className="mt-6 px-6 h-12 rounded-2xl bg-mint text-ink-900 font-bold tap">Back to home</button>
        </div>
      );
    }
    const inputCls = "w-full h-14 px-4 rounded-2xl bg-ink-600 text-white text-sm placeholder:text-ink-400 outline-none";
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-fade">
        <div className="px-5 pt-4">
          <h1 className="text-white text-2xl font-extrabold">Book a visit</h1>
          <p className="text-ink-400 text-sm mt-1">Fill in your details and we'll call you to confirm.</p>
        </div>
        <form onSubmit={submit} className="px-5 mt-5 space-y-3">
          <input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Full name" className={inputCls}/>
          <input required type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="Phone number" className={inputCls}/>
          <input required type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="Email address" className={inputCls}/>
          <input required type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className={inputCls}/>
          <input required type="time" value={form.time} onChange={e=>setForm({...form,time:e.target.value})} className={inputCls}/>
          <button type="submit" className="w-full h-14 rounded-2xl bg-mint text-ink-900 font-bold tap flex items-center justify-center gap-2"><I.check className="w-5 h-5"/> Submit request</button>
        </form>
      </div>
    );
  }

  /* ---------------- Cart ---------------- */
  function Cart({ cart, setCart, go }){
    const subtotal = cart.reduce((a,c)=>a+c.price*c.qty,0);
    const fee = cart.length? 9 : 0;
    const total = subtotal + fee;
    const changeQty = (id,delta)=> setCart(c=> c.map(x=> x.id===id? {...x, qty:Math.max(1,x.qty+delta)}:x));
    const remove = (id)=> setCart(c=> c.filter(x=>x.id!==id));
    if(cart.length===0){
      return (
        <div className="h-full flex flex-col items-center justify-center px-8 anim-fade">
          <div className="w-24 h-24 rounded-3xl bg-ink-600 flex items-center justify-center mb-5"><I.bag className="w-12 h-12 text-ink-400"/></div>
          <h2 className="text-white text-xl font-extrabold">Your cart is empty</h2>
          <p className="text-ink-400 text-sm mt-1 text-center">Browse our services and add something to get started.</p>
          <button onClick={()=>go('services')} className="mt-6 px-6 h-12 rounded-2xl bg-mint text-ink-900 font-bold tap">Explore services</button>
        </div>
      );
    }
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-fade">
        <div className="px-5 pt-4">
          <h1 className="text-white text-2xl font-extrabold">Your cart</h1>
          <p className="text-ink-400 text-sm mt-1">{cart.length} service{cart.length>1?'s':''} selected</p>
        </div>
        <div className="px-5 mt-4 space-y-3">
          {cart.map(c=>{
            const Ic = iconFor(c.icon);
            return (
              <div key={c.id} className="flex gap-3 p-3 rounded-2xl bg-ink-600">
                <div className="w-16 h-16 rounded-xl bg-cover bg-center flex-shrink-0" style={{backgroundImage:`linear-gradient(180deg,rgba(20,25,28,0) 50%,#14191c 100%),url(${c.img})`}}></div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-start justify-between">
                    <p className="text-white font-bold text-sm">{c.name}</p>
                    <button onClick={()=>remove(c.id)} className="text-ink-400"><I.trash className="w-4 h-4"/></button>
                  </div>
                  <p className="text-mint font-extrabold text-sm mt-0.5">${c.price*c.qty}</p>
                  <div className="flex items-center gap-3 mt-2">
                    <button onClick={()=>changeQty(c.id,-1)} className="w-7 h-7 rounded-lg bg-ink-700 text-white flex items-center justify-center tap"><I.minus className="w-3.5 h-3.5"/></button>
                    <span className="text-white text-sm font-bold">{c.qty}</span>
                    <button onClick={()=>changeQty(c.id,1)} className="w-7 h-7 rounded-lg bg-mint text-ink-900 flex items-center justify-center tap"><I.plus className="w-3.5 h-3.5"/></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div className="px-5 mt-5 rounded-2xl bg-ink-600 p-4 space-y-2">
          <div className="flex justify-between text-sm"><span className="text-ink-300">Subtotal</span><span className="text-white font-semibold">${subtotal}</span></div>
          <div className="flex justify-between text-sm"><span className="text-ink-300">Service fee</span><span className="text-white font-semibold">${fee}</span></div>
          <div className="h-px bg-white/10 my-1"></div>
          <div className="flex justify-between"><span className="text-white font-bold">Total</span><span className="text-mint font-extrabold text-lg">${total}</span></div>
        </div>
        <div className="absolute bottom-0 left-0 right-0 glass border-t border-white/5 px-5 py-4 pb-6">
          <button onClick={()=>go('booking')} className="w-full h-14 rounded-2xl bg-mint text-ink-900 font-bold tap flex items-center justify-center gap-2"><I.calendar className="w-5 h-5"/> Proceed to booking</button>
        </div>
      </div>
    );
  }

  /* ---------------- Notifications ---------------- */
  function Notifications({ go }){
    const items = [
      { t:'Booking confirmed', d:'Lawn mowing on Sep 12, 09:30 AM.', time:'2h', icon:I.check },
      { t:'Special offer', d:'20% off seasonal clean-up — ends soon!', time:'5h', icon:I.leaf },
      { t:'Pro on the way', d:'Your gardener is arriving in 30 min.', time:'1d', icon:I.user },
    ];
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-right">
        <div className="flex items-center gap-3 px-5 pt-4">
          <button onClick={()=>go('home')} className="w-10 h-10 rounded-full bg-ink-600 flex items-center justify-center tap"><I.back className="w-5 h-5 text-white"/></button>
          <h1 className="text-white text-2xl font-extrabold">Notifications</h1>
        </div>
        <div className="px-5 mt-4 space-y-3">
          {items.map((n,i)=>(
            <div key={i} className="flex gap-3 p-4 rounded-2xl bg-ink-600">
              <div className="w-10 h-10 rounded-xl bg-mint/15 text-mint flex items-center justify-center flex-shrink-0"><n.icon className="w-5 h-5"/></div>
              <div className="flex-1">
                <div className="flex justify-between"><p className="text-white font-bold text-sm">{n.t}</p><span className="text-ink-400 text-[11px]">{n.time}</span></div>
                <p className="text-ink-300 text-xs mt-0.5">{n.d}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ---------------- Settings ---------------- */
  function Settings({ theme, setTheme }){
    const dark = theme==='dark';
    const Toggle = ({on,set})=>(
      <button onClick={()=>set(!on)} className={`w-12 h-7 rounded-full p-1 transition-colors ${on?'bg-mint':'bg-ink-400'}`}>
        <span className={`block w-5 h-5 rounded-full bg-white transition-transform ${on?'translate-x-5':''}`}></span>
      </button>
    );
    return (
      <div className="h-full overflow-y-auto no-scrollbar pb-28 anim-fade">
        <div className="px-5 pt-4">
          <h1 className="text-white text-2xl font-extrabold">Settings</h1>
        </div>
        <div className="px-5 mt-4 space-y-2">
          <div className="flex items-center justify-between p-4 rounded-2xl bg-ink-600">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-mint/15 text-mint flex items-center justify-center"><I.sun className="w-5 h-5"/></div>
              <div><p className="text-white text-sm font-semibold">{dark?'Dark theme':'Light theme'}</p><p className="text-ink-400 text-xs">Switch appearance</p></div>
            </div>
            <Toggle on={dark} set={(v)=>setTheme(v?'dark':'light')}/>
          </div>
          <button onClick={()=>alert('GreenScape Privacy Policy\n\nWe respect your privacy. We only collect the name, email and phone you provide to confirm your bookings. We never sell your data. You can request deletion of your data anytime by contacting support.')} className="w-full flex items-center gap-3 p-4 rounded-2xl bg-ink-600 tap">
            <div className="w-10 h-10 rounded-xl bg-ink-700 text-ink-300 flex items-center justify-center"><I.settings className="w-5 h-5"/></div>
            <div className="flex-1 text-left"><p className="text-white text-sm font-semibold">Privacy policy</p><p className="text-ink-400 text-xs">How we handle your data</p></div>
            <I.chevron className="w-5 h-5 text-ink-400"/>
          </button>
        </div>
        <p className="text-center text-ink-400 text-xs mt-6">GreenScape v1.0.0</p>
      </div>
    );
  }

  /* ---------------- App shell ---------------- */
  function App(){
    const [boot,setBoot] = useState('splash');
    const [screen,setScreen] = useState('home');
    const [detail,setDetail] = useState(null);
    const [cart,setCart] = useState([]);
    const [hist,setHist] = useState(['home']);
    const [theme,setTheme] = useState(()=> localStorage.getItem('gs-theme')||'dark');

    useEffect(()=>{ localStorage.setItem('gs-theme',theme); document.body.style.background = theme==='dark'?'#0b0f11':'#e9eef2'; },[theme]);

    const go = (s)=>{ setScreen(s); setHist(h=>[...h,s]); };
    const back = ()=>{ if(hist.length>1){ const h=[...hist]; h.pop(); setHist(h); setScreen(h[h.length-1]); } };
    const openService = (s)=>{ setDetail(s); setScreen('detail'); setHist(h=>[...h,'detail']); };
    const addToCart = (s)=> setCart(c=>{ const ex=c.find(x=>x.id===s.id); if(ex) return c.map(x=>x.id===s.id?{...x,qty:x.qty+s.qty}:x); return [...c,s]; });

    if(boot==='splash') return <Shell theme={theme}><Splash onDone={()=>setBoot('onboard')}/></Shell>;
    if(boot==='onboard') return <Shell theme={theme}><Onboarding onDone={()=>{setBoot('ready');setScreen('home');}}/></Shell>;

    let content;
    if(screen==='detail' && detail) content = <ServiceDetail service={detail} onBack={back} addToCart={addToCart} go={go}/>;
    else if(screen==='home') content = <Home go={go} openService={openService} cart={cart}/>;
    else if(screen==='services') content = <Services openService={openService} go={go}/>;
    else if(screen==='booking') content = <Booking go={go} cart={cart}/>;
    else if(screen==='cart') content = <Cart cart={cart} setCart={setCart} go={go}/>;
    else if(screen==='profile') content = <Settings theme={theme} setTheme={setTheme}/>;
    else if(screen==='notifications') content = <Notifications go={go}/>;
    else content = <Home go={go} openService={openService} cart={cart}/>;

    const showNav = ['home','services','booking','cart','profile'].includes(screen);

    return (
      <Shell theme={theme}>
        {content}
        {showNav && <BottomNav active={screen} go={go} cartCount={cart.reduce((a,c)=>a+c.qty,0)}/>}
      </Shell>
    );
  }

  /* UI-only shell: no phone frame, no status bar (time/wifi/battery). Just the app. */
  function Shell({ children, theme }){
    return (
      <div className="min-h-screen w-full bg-ink-800" data-theme={theme}>
        <div className="relative w-full h-screen overflow-hidden">
          <div className="absolute inset-0">{children}</div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
